<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f3f1;font-family:system-ui,-apple-system,sans-serif}.calc{width:min(380px,92vw);padding:18px;background:white;border:1px solid #ddd;border-radius:20px;box-shadow:0 12px 40px #0001}.display{padding:18px;text-align:right;min-height:90px}.expr{height:24px;color:#777;overflow:hidden}.value{font-size:46px;font-weight:650;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.keys button{height:64px;border:0;border-radius:14px;background:#eee;font-size:21px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.keys button:active{transform:scale(.97)}.op{background:#ddd!important}.eq{background:#111!important;color:#fff}.wide{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
 <div class="display"><div id="expr" class="expr"></div><div id="value" class="value">0</div></div>
 <div class="keys" id="keys">
  <button type="button" data-a="clear">AC</button><button type="button" data-a="back">⌫</button><button type="button" data-v="(">(</button><button type="button" data-v=")" class="op">)</button>
  <button type="button" data-v="7">7</button><button type="button" data-v="8">8</button><button type="button" data-v="9">9</button><button type="button" data-v="/" class="op">÷</button>
  <button type="button" data-v="4">4</button><button type="button" data-v="5">5</button><button type="button" data-v="6">6</button><button type="button" data-v="*" class="op">×</button>
  <button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="-" class="op">−</button>
  <button type="button" data-v="0" class="wide">0</button><button type="button" data-v=".">.</button><button type="button" data-v="+" class="op">+</button>
  <button type="button" data-a="equals" class="wide eq">=</button>
 </div>
</div>
<script>
'use strict';
const exprEl=document.getElementById('expr'),valueEl=document.getElementById('value');let expr='';
function tokenize(s){let a=[],i=0;while(i<s.length){if(/\s/.test(s[i])){i++;continue}if(/[0-9.]/.test(s[i])){let j=i,dots=0;while(j<s.length&&/[0-9.]/.test(s[j])){if(s[j]==='.')dots++;j++}if(dots>1)throw Error();a.push(Number(s.slice(i,j)));i=j;continue}if('+-*/()'.includes(s[i])){a.push(s[i++]);continue}throw Error()}return a}
function calc(s){let t=tokenize(s),p=0;function primary(){if(t[p]==='-'){p++;return-primary()}if(t[p]==='('){p++;let x=add();if(t[p]!==')')throw Error();p++;return x}if(typeof t[p]==='number')return t[p++];throw Error()}function mul(){let x=primary();while(t[p]==='*'||t[p]==='/'){let o=t[p++],y=primary();if(o==='/'&&y===0)throw Error();x=o==='*'?x*y:x/y}return x}function add(){let x=mul();while(t[p]==='+'||t[p]==='-'){let o=t[p++],y=mul();x=o==='+'?x+y:x-y}return x}let x=add();if(p!==t.length||!Number.isFinite(x))throw Error();return Number(x.toFixed(12))}
function render(){exprEl.textContent=expr;try{valueEl.textContent=expr?String(calc(expr)):'0'}catch{valueEl.textContent='…'}}
function press(v){expr+=v;render()}
document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='clear'){expr='';render()}else if(b.dataset.a==='back'){expr=expr.slice(0,-1);render()}else if(b.dataset.a==='equals'){try{const x=calc(expr);expr=String(x);render()}catch{valueEl.textContent='Error'}}else press(b.dataset.v)});
document.addEventListener('keydown',e=>{if(/[0-9+\-*/().]/.test(e.key))press(e.key);else if(e.key==='Enter'||e.key==='='){try{expr=String(calc(expr));render()}catch{valueEl.textContent='Error'}}else if(e.key==='Backspace'){expr=expr.slice(0,-1);render()}else if(e.key==='Escape'){expr='';render()}});render();
</script>
</body>
</html>
