[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-factory"
version = "0.1.0"
description = "Executable Content Factory v0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "truststore>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "external: opt-in test requiring a real external provider and credentials",
]
