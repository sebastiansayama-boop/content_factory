name: Free Retrieval Live Proof

on:
  push:
    branches:
      - "tmp/free-retrieval-live-proof-20261001"

permissions: {}

jobs:
  read-live-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tmp/free-retrieval-live-proof-20261001"
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect live knowledge
        env:
          BASE_URL: "https://content-factory-1zij.onrender.com"
          FACTORY_API_TOKEN: ${{ secrets.FACTORY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ["BASE_URL"].rstrip("/")
          token = os.environ["FACTORY_API_TOKEN"]
          req = urllib.request.Request(
              base + "/api/runs",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              payload = json.loads(r.read().decode())
          for run in payload.get("runs", []):
              claims = ((run.get("result") or {}).get("research") or {}).get("claims") or []
              for claim in claims:
                  print(json.dumps({
                      "run_id": run.get("run_id"),
                      "title": run.get("title"),
                      "status": claim.get("status"),
                      "text": claim.get("text"),
                  }, ensure_ascii=False))
          PY
