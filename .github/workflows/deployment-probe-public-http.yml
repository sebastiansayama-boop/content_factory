name: Deployment Probe Public HTTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  public-http:
    runs-on: ubuntu-slim
    steps:
      - name: Probe deployment substrate root
        run: |
          set -eu
          url="https://content-factory-deployment-probe.onrender.com/"
          echo "GET $url"
          curl --fail --show-error --silent --location --dump-header /tmp/headers.txt --output /tmp/body.txt "$url"
          echo "--- response headers ---"
          cat /tmp/headers.txt
          echo "--- response body ---"
          cat /tmp/body.txt
          grep -q 'deployment-probe: OK' /tmp/body.txt

      - name: Probe deployment substrate health
        run: |
          set -eu
          url="https://content-factory-deployment-probe.onrender.com/health"
          echo "GET $url"
          curl --fail --show-error --silent --location --dump-header /tmp/health-headers.txt --output /tmp/health-body.txt "$url"
          echo "--- response headers ---"
          cat /tmp/health-headers.txt
          echo "--- response body ---"
          cat /tmp/health-body.txt
          grep -q '"status": "ok"' /tmp/health-body.txt

      - name: Probe Content Factory root
        run: |
          set -eu
          url="https://content-factory-1zij.onrender.com/"
          echo "GET $url"
          curl --fail --show-error --silent --location --dump-header /tmp/factory-headers.txt --output /tmp/factory-body.txt "$url"
          echo "--- response headers ---"
          cat /tmp/factory-headers.txt
          echo "--- response body ---"
          cat /tmp/factory-body.txt
          grep -q 'Content Factory' /tmp/factory-body.txt

      - name: Probe Content Factory health
        run: |
          set -eu
          url="https://content-factory-1zij.onrender.com/health"
          echo "GET $url"
          curl --fail --show-error --silent --location --dump-header /tmp/factory-health-headers.txt --output /tmp/factory-health-body.txt "$url"
          echo "--- response headers ---"
          cat /tmp/factory-health-headers.txt
          echo "--- response body ---"
          cat /tmp/factory-health-body.txt
          grep -q '"status": "ok"' /tmp/factory-health-body.txt
