name: Telegram Episode 10 Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/PUBLISH_EPISODE_10_ONCE"

permissions: {}

jobs:
  publish:
    if: ${{ hashFiles('.github/PUBLISH_EPISODE_10_ONCE') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/publish_telegram_episode10.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
