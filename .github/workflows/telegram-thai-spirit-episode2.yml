name: Telegram Thai Spiritual World Episode 2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: telegram-thai-spirit-episode-2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event.head_commit.message == 'publish: thai-spirit-episode-2'
        with:
          python-version: "3.12"
      - run: pip install -e .
        if: github.event.head_commit.message == 'publish: thai-spirit-episode-2'
      - run: python scripts/publish_telegram_thai_spirit_episode2.py
        if: github.event.head_commit.message == 'publish: thai-spirit-episode-2'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
