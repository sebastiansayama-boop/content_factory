name: Runtime real content capability E2E

on:
  workflow_dispatch:

jobs:
  runtime-real-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_ENDPOINT: http://127.0.0.1:11434/api/generate
      OLLAMA_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: ollama serve > /tmp/ollama.log 2>&1 &
      - name: Pull local model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Run real capability chain
        run: pytest -q tests/test_runtime_real_content_e2e.py -m external -s
