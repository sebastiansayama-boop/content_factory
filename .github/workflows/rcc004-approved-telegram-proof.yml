name: RCC-004 Approved Telegram Proof

# Safety: push only on changes to this fake-only workflow; no Telegram token.
# Real-send is never called.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rcc004-approved-telegram-proof.yml
      - tests/test_rcc004_proof_safety.py
  workflow_dispatch:
    inputs:
      dry_run_acknowledgement:
        description: 'Type DRY_RUN_ONLY; this workflow cannot publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'push' || inputs.dry_run_acknowledgement == 'DRY_RUN_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Fake Telegram idempotency regression
        env:
          FACTORY_TELEGRAM_FAKE: '1'
          TELEGRAM_CHAT_ID: fake-chat
        run: pytest -q tests/test_library_publication_idempotency.py tests/test_rcc004_proof_safety.py
