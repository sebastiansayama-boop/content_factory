name: RCC-004 Approved Telegram Proof

# Safety: no push, schedule, or workflow_dispatch trigger.
# A later real-send workflow requires a separate reviewed change.
on:
  workflow_dispatch:
    inputs:
      dry_run_acknowledgement:
        description: 'Type DRY_RUN_ONLY; this workflow cannot publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    if: inputs.dry_run_acknowledgement == 'DRY_RUN_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Fake Telegram idempotency regression
        env:
          FACTORY_TELEGRAM_FAKE: '1'
          TELEGRAM_CHAT_ID: fake-chat
        run: pytest -q tests/test_library_publication_idempotency.py
