name: CI

on:
  push:
    branches: [main, experiment/dependency-aware-regeneration-v1, experiment/research-knowledge-v1, experiment/model-dataset-v1]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q -m "not browser"
      - run: python scripts/validate_model_eval.py
      - run: python scripts/run_model_eval.py --output /tmp/model_eval_report.json
      - run: cat /tmp/model_eval_report.json

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m browser --browser chromium

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          context: .
          push: false
          tags: content-factory:test
