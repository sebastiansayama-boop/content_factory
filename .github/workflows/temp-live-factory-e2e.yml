name: Temp Live Factory E2E

on:
  push:
    branches: [temp/live-factory-e2e-20261001]

jobs:
  live-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Run live Content Factory through Render
        env:
          BASE_URL: https://content-factory-replay-e2e.onrender.com
          FACTORY_API_TOKEN: ${{ secrets.FACTORY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FACTORY_API_TOKEN}" ]; then
            echo "FACTORY_API_TOKEN GitHub secret is not configured"
            exit 2
          fi

          auth=(-H "Authorization: Bearer ${FACTORY_API_TOKEN}")
          json=(-H "Content-Type: application/json")

          create_body='{"title":"Future imaginaries across eras","brief":"How people of different eras imagined the future: from ancient conceptions of fate, cycles and prophecy to early modern and nineteenth-century ideas of an open future. Create a fact-based, publishable short-form content package. Distinguish documented evidence from uncertainty; do not invent historical claims.","audience":"","goal":"Create a publishable short-form content asset","formats":["short_video"],"constraints":[]}'

          create_resp="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${json[@]}" -X POST "${BASE_URL}/api/runs" --data "${create_body}")"
          echo "--- create run ---"
          echo "${create_resp}"

          run_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["run_id"])' <<<"${create_resp}")"

          set +e
          factory_resp="$(curl --silent --show-error "${auth[@]}" "${json[@]}" -X POST "${BASE_URL}/api/runs/${run_id}/factory" --data '{}')"
          factory_code="$(curl --silent --show-error -o /tmp/factory.headers -w '%{http_code}' "${auth[@]}" "${json[@]}" -X POST "${BASE_URL}/api/runs/${run_id}/factory" --data '{}')"
          set -e

          echo "--- first factory response ---"
          echo "HTTP ${factory_code}"
          echo "${factory_resp}"

          if [ "${factory_code}" = "409" ]; then
            python - <<'PY' <<<"${factory_resp}"
import json,sys
data=json.load(sys.stdin)
with open("/tmp/claim_ids.txt","w",encoding="utf-8") as f:
    for item in data.get("candidates",[]):
        cid=str(item.get("claim_id","")).strip()
        if cid: f.write(cid+"\n")
PY
            while IFS= read -r claim_id; do
              echo "--- promote ${claim_id} ---"
              curl --fail-with-body --silent --show-error "${auth[@]}" "${json[@]}" -X POST "${BASE_URL}/api/knowledge/${claim_id}/promote" --data '{"decision_ref":"live-e2e"}'
            done </tmp/claim_ids.txt

            factory_resp="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${json[@]}" -X POST "${BASE_URL}/api/runs/${run_id}/factory" --data '{}')"
          elif [ "${factory_code}" != "200" ]; then
            echo "Unexpected first factory HTTP status: ${factory_code}"
            exit 1
          fi

          echo "--- final factory response ---"
          echo "${factory_resp}"

          python - <<'PY' <<<"${factory_resp}"
import json,sys
data=json.load(sys.stdin)
run=data["run"]
result=run.get("result") or {}
production=result.get("production") or {}
qc=production.get("qc") or {}
units=(result.get("script") or {}).get("units") or []
assert run.get("status")=="REVIEW", run
assert units and any(str(u.get("text","")).strip() for u in units), result
assert production.get("status")=="READY_FOR_REVIEW", production
assert qc.get("passed") is True, qc
print("LIVE_FACTORY_E2E_PASS")
print("run_id:", run.get("run_id"))
print("status:", run.get("status"))
print("script_units:", len(units))
print("qc_status:", qc.get("status"))
print("script:")
for u in units:
    t=str(u.get("text","")).strip()
    if t: print(t)
PY
