name: Temporary Feature Unit Proof

on:
  push:
    branches: [feat/information-flow-contract]

jobs:
  unit-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/information-flow-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q -m "not browser and not external"
