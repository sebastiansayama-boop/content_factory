name: Telegram Episode 10 Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-episode-10
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/publish_telegram_library.py
        env:
          TELEGRAM_EPISODE: "10"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
