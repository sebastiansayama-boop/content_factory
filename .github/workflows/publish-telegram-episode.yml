name: Publish Telegram Episode

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: telegram-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Execute explicit publication command
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LIBRARY_PATH: library/telegram/thai-spiritual-world.json
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$COMMIT_MESSAGE" in
            "publish: thai-spirit-episode-"*)
              export TELEGRAM_LIBRARY_PATH=library/telegram/thai-spiritual-world.json
              episode="${COMMIT_MESSAGE#publish: thai-spirit-episode-}"
              ;;
            "publish: computer-games-episode-"*)
              export TELEGRAM_LIBRARY_PATH=library/telegram/computer-games-series.json
              episode="${COMMIT_MESSAGE#publish: computer-games-episode-}"
              ;;
            *) echo "Ordinary commit; publication skipped."; exit 0 ;;
          esac
          if ! [[ "$episode" =~ ^[0-9]+$ ]]; then
            echo "Invalid publication command: $COMMIT_MESSAGE"
            exit 1
          fi
          export TELEGRAM_EPISODE="$episode"
          python scripts/publish_telegram_library.py
