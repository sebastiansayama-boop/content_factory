name: Publish Telegram Episode

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: telegram-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Gate publication command
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" != publish: thai-spirit-episode-* ]]; then
            echo "Not a publication command; no-op."
            exit 0
          fi
      - name: Resolve episode
        id: episode
        shell: bash
        run: |
          title="${{ github.event.head_commit.message }}"
          episode="${title#publish: thai-spirit-episode-}"
          if ! [[ "$episode" =~ ^[0-9]+$ ]]; then
            echo "Invalid episode: $episode"
            exit 1
          fi
          echo "episode=$episode" >> "$GITHUB_OUTPUT"
      - name: Publish exactly one episode
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EPISODE: ${{ steps.episode.outputs.episode }}
          TELEGRAM_LIBRARY_PATH: library/telegram/thai-spiritual-world.json
        run: python scripts/publish_telegram_library.py
