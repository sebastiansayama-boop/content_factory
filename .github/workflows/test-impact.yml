name: Test impact analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute dependency closure
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base=""
          fi
          python scripts/test_impact.py --base "$base" --head "$HEAD_SHA" --format text
      - name: Validate impact model
        run: python -m pytest -q tests/test_test_impact.py
