name: Live Product API Proof

on:
  push:
    branches: [tmp/live-product-api-proof-20261001]

permissions: {}

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise live Content Factory API
        env:
          FACTORY_API_TOKEN: ${{ secrets.FACTORY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'https://content-factory-1zij.onrender.com'
          token = os.environ.get('FACTORY_API_TOKEN', '').strip()
          if not token:
              raise SystemExit('FACTORY_API_TOKEN secret is missing')

          def call(method, path, body=None):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Content-Type': 'application/json',
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read().decode('utf-8')
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {'raw': raw}
                  return exc.code, payload

          brief = 'Explain convergent evolution: why unrelated animal lineages can independently evolve similar functional traits under similar environmental pressures.'
          status, created = call('POST', '/api/runs', {
              'title': 'Live API proof — convergent evolution',
              'brief': brief,
              'audience': 'general',
              'goal': 'Create a publishable short-form content asset',
              'formats': ['short_video'],
              'constraints': [],
          })
          assert status == 201, (status, created)
          run_id = created['run_id']
          print('CREATE_RUN:', status, run_id)

          status, first = call('POST', '/api/runs/' + run_id + '/factory', {})
          print('FACTORY_RESEARCH:', status)
          claim_text = None
          if status == 409:
              candidates = first.get('candidates') or []
              assert candidates, first
              candidate = candidates[0]
              claim_id = candidate['claim_id']
              claim_text = candidate.get('text') or ''
              assert claim_text
              status, promoted = call('POST', '/api/knowledge/' + claim_id + '/promote', {'decision_ref': 'LIVE-E2E-REVIEW'})
              assert status == 200, (status, promoted)
              assert promoted['status'] == 'ACCEPTED', promoted
              print('KNOWLEDGE_PROMOTE:', status, claim_id, promoted['status'])
              status, factory = call('POST', '/api/runs/' + run_id + '/factory', {})
          else:
              factory = first
          assert status == 200, (status, factory)

          run = factory['run']
          result = run.get('result') or {}
          claims = result.get('research', {}).get('claims') or []
          if not claim_text and claims:
              claim_text = claims[0].get('text') or ''
          assert claim_text
          units = result.get('script', {}).get('units') or []
          script_text = '\\n'.join(str(u.get('text') or '') for u in units)
          assert claim_text in script_text, {'claim_text': claim_text, 'script': script_text}
          qc = (result.get('production') or {}).get('qc') or {}
          assert run['status'] == 'REVIEW', run
          assert qc.get('status') == 'PASSED', qc
          print('PRODUCTION_QC:', 'REVIEW', qc.get('status'), 'units=', len(units), 'claims=', len(claims))
          print('CLAIM_PROPAGATED:', True)

          status, approved = call('POST', '/api/runs/' + run_id + '/approve', {
              'decision_ref': 'LIVE-E2E-HUMAN-APPROVAL',
              'channel': 'local',
          })
          assert status == 200, (status, approved)
          assert approved['status'] == 'APPROVED', approved
          publication = approved.get('result', {}).get('publication') or {}
          assert publication.get('status') == 'PREPARED', publication
          assert publication.get('channel') == 'local', publication
          print('APPROVAL:', approved['status'])
          print('PUBLICATION_PREPARED:', publication.get('status'), publication.get('channel'))
          print('LIVE_E2E_RESULT: PASS')
          PY