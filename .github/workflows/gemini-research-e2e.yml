name: Gemini Research E2E

on:
  push:
    branches: [feat/information-flow-contract]

jobs:
  gemini-research-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/information-flow-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run real Gemini research test
        env:
          RUN_GEMINI_RESEARCH_E2E: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -q tests/test_gemini_research_e2e.py -m external -s
