name: Content Factory Vertical Slice Proof

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_telegram:
        description: "Run the real Telegram publication proof"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  local-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Local producer regression
        run: pytest -q tests/test_local_adapter.py
      - name: Factory HTTP E2E
        run: pytest -q tests/test_product_http_routes.py -m "not external"
      - name: Browser user vertical slice
        run: |
          python -m playwright install --with-deps chromium
          pytest -q tests/test_browser_replay.py -m browser --browser chromium

  telegram-proof:
    if: ${{ inputs.run_telegram || contains(github.event.head_commit.message, '[telegram-e2e]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Real Telegram publication proof
        env:
          RUN_TELEGRAM_E2E: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -s -q tests/test_telegram_publication_smoke.py -m external
