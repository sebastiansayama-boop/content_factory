name: Telegram Publication Proof

on:
  push:
    branches: ["experiment/publication-diversity-guard-v1"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  telegram-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Real Telegram publication proof
        env:
          RUN_TELEGRAM_E2E: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -s -q tests/test_telegram_historical_material_smoke.py -m external -k generated_historical_material
