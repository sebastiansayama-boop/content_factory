name: publication-diversity-experiment

on:
  push:
    branches: [experiment/publication-diversity-guard-v1]
  pull_request:
    branches: [main]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_publication_diversity.py tests/test_publication_diversity_builder.py
      - run: python -m py_compile src/content_factory/knowledge_content.py src/content_factory/agent_tools.py src/content_factory/agent_tool_capability.py
