name: Ollama provider live E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ollama-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
      - name: Pull local model
        run: ollama pull llama3.2:1b
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Contract tests
        run: pytest -q tests/test_ollama_adapter.py tests/test_provider_boundaries.py
      - name: Live topic to text
        env:
          OLLAMA_MODEL: llama3.2:1b
          OLLAMA_ENDPOINT: http://127.0.0.1:11434/api/generate
        run: |
          python - <<'PY'
          from content_factory.ollama_adapter import OllamaAdapter
          result = OllamaAdapter().generate(
              "Write one concise Russian sentence explaining why scientific claims should preserve evidence scope. Return JSON with a single key text."
          )
          output = OllamaAdapter.response_text(result)
          assert output.strip()
          print(output)
          PY
