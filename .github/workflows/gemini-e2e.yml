name: Gemini E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  gemini-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run real Gemini Content Factory test
        env:
          RUN_GEMINI_E2E: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -q tests/test_gemini_e2e.py -m external -s
