version: 7
status: candidate_with_executable_runtime_v0_and_external_boundary
name: content_factory
parent_system: content_ecosystem

boundaries:
  upstream_context:
    - strategy
    - portfolio
    - audience_market_context
    - product_business_context
  factory_output:
    - verified_content_release
    - publication_effect_record
  downstream_context:
    - audience_experience
    - market_response
    - business_outcome

architecture:
  value_flow:
    - input
    - knowledge
    - editorial
    - production
    - quality
    - distribution
    - learning
  control_plane:
    - prioritization
    - intake
    - routing
    - wip
    - queues
    - capacity
    - scheduling
    - ownership
    - service_expectations
    - orchestration
    - bottleneck_management
  semantic_substrate:
    - structured_content
    - knowledge_graph
    - identity
    - revisions
    - provenance
    - dependencies
    - evidence
    - claims
    - reusable_components
    - taxonomy
  capability_system:
    - discover
    - research
    - extract
    - analyze
    - write
    - design
    - generate
    - transform
    - localize
    - verify
    - package
    - publish
    - measure
    - learn
  engineering_system:
    - domain_model
    - execution
    - storage
    - integration
    - governance
    - observability
    - infrastructure

execution_boundary:
  - work_item -> capability_request
  - capability_request -> executor
  - executor -> provider_adapter
  - provider_adapter -> tool_model_service_provider
  - tool_model_service_provider -> execution_result_or_external_effect
  - execution_result_or_external_effect -> verification_or_observation

runtime_v0:
  status: implemented
  scope: one_work_item_one_capability_one_publisher
  implementation:
    - src/content_factory/runtime.py
  tests:
    - tests/test_runtime.py
  known_limits:
    - in_memory_state
    - in_memory_event_journal
    - single_capability
    - injected_publisher
    - no_crash_recovery
    - no_production_provider_adapter

external_integration_boundary:
  status: designed
  implementation:
    - src/content_factory/integrations.py
  tests:
    - tests/test_integrations.py
  boundary:
    - factory_runtime -> capability_executor -> external_adapter -> provider
  secret_policy:
    raw_values_never_enter_repository: true
    raw_values_never_enter_provenance: true
    raw_values_never_enter_logs: true
  integration_sequence:
    - runtime_contract
    - local_tests
    - ci_execution
    - compute_environment
    - secret_mechanism
    - one_provider_adapter
    - provider_credentials
    - connectivity_test
    - real_capability_execution
    - verification
    - release_authority
    - one_external_publisher
    - external_effect_observation
    - durable_storage
    - recovery_and_idempotency
    - additional_providers_and_n8n
  n8n_boundary: external_service_orchestration_only
  external_effect_requires_explicit_boundary: true

external_proof:
  minimum_case:
    - bounded_work_item
    - explicit_requested_outcome
    - identifiable_knowledge_basis
    - editorial_decision_and_specification
    - concrete_capability_execution
    - identifiable_output_revision
    - revision_bound_verification
    - explicit_acceptance_and_authority
    - authorized_release
    - external_delivery_or_public_access
    - externally_observable_effect
    - reconstructable_provenance_chain
    - reconstructable_authority_chain
    - no_silent_boundary_skipped
  terminal_conditions:
    external_effect_observed: true
    provenance_reconstructable: true
    authority_chain_reconstructable: true
    no_silent_boundary_skipped: true

work_item:
  identity:
    - work_item_id
    - revision_id
  required_fields:
    - strategic_intent_ref
    - audience_context_ref
    - objective
    - requested_outcome
    - inputs
    - knowledge_basis
    - dependencies
    - required_capabilities
    - owner
    - priority
    - constraints
    - acceptance_criteria
    - release_requirements
    - success_signals

capability_contract:
  required:
    - capability_id
    - input_contract
    - output_contract
    - preconditions
    - constraints
    - quality_requirements
    - authority_requirements
    - failure_semantics
    - observability_requirements

executor_contract:
  required:
    - capability_binding
    - execution_identity
    - provider_adapter
    - result_contract
    - recovery_semantics
    - idempotency_policy
    - authority_boundary

release:
  may_bundle: true
  readiness_boundary: explicit

quality:
  verification_revision_bound: true
  acceptance_distinct_from_verification: true
  acceptance_distinct_from_publication: true
  publication_distinct_from_outcome: true
  execution_result_not_automatically_accepted: true

authority:
  execution_does_not_imply_authority: true
  publish_requires_explicit_authority: true
  external_effect_requires_explicit_boundary: true

learning:
  metric_is_not_learning: true
  learning_requires_interpretation: true
  knowledge_update_requires_explicit_promotion: true
  ecosystem_strategy_update_requires_explicit_promotion: true
