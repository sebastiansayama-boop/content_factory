version: 6
status: candidate_with_executable_runtime_v0
name: content_factory
parent_system: content_ecosystem

boundaries:
  upstream_context:
    - strategy
    - portfolio
    - audience_market_context
    - product_business_context
  factory_output:
    - verified_content_release
    - publication_effect_record
  downstream_context:
    - audience_experience
    - market_response
    - business_outcome

architecture:
  value_flow:
    - input
    - knowledge
    - editorial
    - production
    - quality
    - distribution
    - learning

  control_plane:
    - prioritization
    - intake
    - routing
    - wip
    - queues
    - capacity
    - scheduling
    - ownership
    - service_expectations
    - orchestration
    - bottleneck_management

  semantic_substrate:
    - structured_content
    - knowledge_graph
    - identity
    - revisions
    - provenance
    - dependencies
    - evidence
    - claims
    - reusable_components
    - taxonomy

  capability_system:
    - discover
    - research
    - extract
    - analyze
    - write
    - design
    - generate
    - transform
    - localize
    - verify
    - package
    - publish
    - measure
    - learn

  engineering_system:
    - domain_model
    - execution
    - storage
    - integration
    - governance
    - observability
    - infrastructure

flow:
  - ecosystem_context -> input
  - input -> knowledge
  - knowledge -> editorial
  - editorial -> production
  - production -> quality
  - quality -> distribution
  - distribution -> external_effect
  - external_effect -> learning
  - learning -> knowledge
  - learning -> editorial
  - learning -> production
  - learning -> ecosystem_context_review

execution_boundary:
  - work_item -> capability_request
  - capability_request -> executor
  - executor -> provider_adapter
  - provider_adapter -> tool_model_service_provider
  - tool_model_service_provider -> execution_result_or_external_effect
  - execution_result_or_external_effect -> verification_or_observation

runtime_v0:
  status: implemented
  scope: one_work_item_one_capability_one_publisher
  states:
    - RECEIVED
    - ADMITTED
    - PRODUCED
    - VERIFIED
    - ACCEPTED
    - RELEASE_READY
    - RELEASED
    - DELIVERED
    - OBSERVED
    - FAILED
  transitions:
    - submit
    - admit
    - execute
    - verify
    - accept
    - release_ready
    - release
    - deliver
    - observe
    - fail
  implementation:
    - src/content_factory/runtime.py
  tests:
    - tests/test_runtime.py
  known_limits:
    - in_memory_state
    - in_memory_event_journal
    - single_capability
    - injected_publisher
    - no_crash_recovery
    - no_production_provider_adapter

external_proof:
  minimum_case:
    - bounded_work_item
    - explicit_requested_outcome
    - identifiable_knowledge_basis
    - editorial_decision_and_specification
    - concrete_capability_execution
    - identifiable_output_revision
    - revision_bound_verification
    - explicit_acceptance_and_authority
    - authorized_release
    - external_delivery_or_public_access
    - externally_observable_effect
    - reconstructable_provenance_chain
    - reconstructable_authority_chain
    - no_silent_boundary_skipped
  terminal_conditions:
    external_effect_observed: true
    provenance_reconstructable: true
    authority_chain_reconstructable: true
    no_silent_boundary_skipped: true

control_plane_relations:
  - control -> input
  - control -> knowledge
  - control -> editorial
  - control -> production
  - control -> quality
  - control -> distribution
  - control -> learning

substrate_relations:
  - substrate <-> input
  - substrate <-> knowledge
  - substrate <-> editorial
  - substrate <-> production
  - substrate <-> quality
  - substrate <-> distribution
  - substrate <-> learning
  - substrate <-> capability_system
  - substrate <-> engineering_system

work_item:
  identity:
    - work_item_id
    - revision_id
  required_fields:
    - strategic_intent_ref
    - audience_context_ref
    - objective
    - requested_outcome
    - inputs
    - knowledge_basis
    - dependencies
    - required_capabilities
    - owner
    - priority
    - constraints
    - acceptance_criteria
    - release_requirements
    - success_signals

capability_contract:
  required:
    - capability_id
    - input_contract
    - output_contract
    - preconditions
    - constraints
    - quality_requirements
    - authority_requirements
    - failure_semantics
    - observability_requirements

executor_contract:
  required:
    - capability_binding
    - execution_identity
    - provider_adapter
    - result_contract
    - recovery_semantics
    - idempotency_policy
    - authority_boundary

release:
  may_bundle: true
  readiness_boundary: explicit

quality:
  verification_revision_bound: true
  acceptance_distinct_from_verification: true
  acceptance_distinct_from_publication: true
  publication_distinct_from_outcome: true
  execution_result_not_automatically_accepted: true

authority:
  execution_does_not_imply_authority: true
  publish_requires_explicit_authority: true
  external_effect_requires_explicit_boundary: true

learning:
  metric_is_not_learning: true
  learning_requires_interpretation: true
  knowledge_update_requires_explicit_promotion: true
  ecosystem_strategy_update_requires_explicit_promotion: true

factory_principles:
  - pull_over_unbounded_push
  - control_wip
  - route_by_capability_and_risk
  - reuse_semantic_content
  - preserve_provenance
  - preserve_dependencies
  - automate_repeatable_work
  - escalate_consequential_decisions
  - manage_bottlenecks_continuously
  - optimize_system_flow_over_local_utilization
  - decouple_factory_from_provider_implementations
  - preserve_replaceable_execution_mechanisms
