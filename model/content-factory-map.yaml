version: 12
status: candidate_with_durable_runtime_real_provider_boundary_and_learning_model_evolution
name: content_factory
parent_system: content_ecosystem

boundaries:
  upstream_context:
    - strategy
    - portfolio
    - audience_market_context
    - product_business_context
  factory_output:
    - verified_content_release
    - publication_effect_record
  downstream_context:
    - audience_experience
    - market_response
    - business_outcome

architecture:
  value_flow:
    - input
    - knowledge
    - editorial
    - production
    - quality
    - distribution
    - learning
  control_plane:
    - prioritization
    - intake
    - routing
    - wip
    - queues
    - capacity
    - scheduling
    - ownership
    - service_expectations
    - orchestration
    - bottleneck_management
  semantic_substrate:
    - structured_content
    - knowledge_graph
    - identity
    - revisions
    - provenance
    - dependencies
    - evidence
    - claims
    - reusable_components
    - taxonomy
  capability_system:
    - discover
    - research
    - extract
    - analyze
    - write
    - design
    - generate
    - transform
    - localize
    - verify
    - package
    - publish
    - measure
    - learn
  engineering_system:
    - domain_model
    - execution
    - storage
    - integration
    - governance
    - observability
    - infrastructure

execution_boundary:
  - work_item -> capability_request
  - capability_request -> executor
  - executor -> provider_adapter
  - provider_adapter -> tool_model_service_provider
  - tool_model_service_provider -> execution_result_or_external_effect
  - execution_result_or_external_effect -> verification_or_observation

runtime_v0:
  status: implemented
  scope: one_work_item_one_capability_one_publisher
  implementation:
    - src/content_factory/runtime.py
    - src/content_factory/runtime_store.py
  tests:
    - tests/test_runtime.py
  durable_control_state:
    status: implemented_phase_1
    store: sqlite
    transaction_boundary: state_transition_plus_event
    journal: append_only_events
    recovery: runtime_reconstructs_states_and_events_on_restart
    durability_mode: WAL_plus_synchronous_FULL
  known_limits:
    - single_capability
    - injected_publisher
    - no_external_effect_idempotency
    - no_queue_workers_or_leases
    - execution_payloads_are_not_rehydrated_into_runtime_state

external_integration_boundary:
  status: implemented_provider_boundary_phase_2_in_progress
  implementation:
    - src/content_factory/integrations.py
    - src/content_factory/openai_adapter.py
    - src/content_factory/openai_capability.py
    - scripts/prove_openai_execution.py
  tests:
    - tests/test_integrations.py
    - tests/test_external_openai.py
    - tests/test_openai_capability.py
  provider:
    name: openai_responses_api
    endpoint: https://api.openai.com/v1/responses
    default_model: gpt-5.6-luna
    secret_env: OPENAI_API_KEY
    real_execution_proof: pending
  boundary:
    - factory_runtime -> capability_executor -> external_adapter -> provider
  secret_policy:
    raw_values_never_enter_repository: true
    raw_values_never_enter_provenance: true
    raw_values_never_enter_logs: true
  integration_sequence:
    - runtime_contract
    - local_tests
    - ci_execution
    - compute_environment
    - secret_mechanism
    - one_provider_adapter
    - provider_credentials
    - connectivity_test
    - real_capability_execution
    - verification
    - release_authority
    - one_external_publisher
    - external_effect_observation
    - durable_storage
    - recovery_and_idempotency
    - additional_providers_and_n8n

phase_sequence:
  - phase: 1
    name: durable_runtime
    status: completed
    proof:
      - sqlite_control_state
      - atomic_state_and_event_transaction
      - restart_recovery_test
      - ci_pass
  - phase: 2
    name: real_execution
    status: in_progress_external_proof_pending
    implementation:
      - openai_responses_adapter
      - openai_capability_binding
      - opt_in_external_execution_test
      - secret_environment_boundary
      - revision_bound_verification_proof_command
    remaining_proof:
      - provider_credentials_available_in_execution_environment
      - connectivity_test
      - real_capability_execution
      - revision_bound_verification
  - phase: 3
    name: real_external_effect
    status: not_started
  - phase: 4
    name: reliability_and_control
    status: not_started
  - phase: 5
    name: factory_control_plane
    status: not_started
  - phase: 6
    name: operations_and_governance
    status: not_started
  - phase: 7
    name: learning_loop
    status: research_complete_real_external_proof_pending
    research_record: 10_records/2026-09-13-learning-loop-program-1-research-synthesis.md
    decision_record: 05_decision/2026-09-13-program-1-learning-loop-model-evolution.md
    externally_supported_scope:
      - observation_evidence_interpretation_separation
      - validity_and_generalizability_limits
      - retrieval_and_application_are_distinct
      - contradiction_requires_evaluation
      - knowledge_can_become_stale_and_requires_revision_or_unlearning
      - memory_is_a_security_boundary
    project_demonstrated_scope:
      - explicit_promotion_and_reusable_memory
      - bounded_memory_consumption_and_decision_change
    unproven_scope:
      - memory_changes_execution
      - real_external_outcome_from_memory_informed_execution
      - outcome_evaluates_memory
      - contradiction_revises_memory_in_real_external_case
      - successful_cross_context_transfer
      - product_or_business_outcome_improvement
    next_proof_boundary: memory_informed_decision -> changed_execution -> real_external_outcome -> evaluation -> memory_revision

external_proof:
  minimum_case:
    - bounded_work_item
    - explicit_requested_outcome
    - identifiable_knowledge_basis
    - editorial_decision_and_specification
    - concrete_capability_execution
    - identifiable_output_revision
    - revision_bound_verification
    - explicit_acceptance_and_authority
    - authorized_release
    - external_delivery_or_public_access
    - externally_observable_effect
    - reconstructable_provenance_chain
    - reconstructable_authority_chain
    - no_silent_boundary_skipped
  terminal_conditions:
    external_effect_observed: true
    provenance_reconstructable: true
    authority_chain_reconstructable: true
    no_silent_boundary_skipped: true

work_item:
  identity:
    - work_item_id
    - revision_id
  required_fields:
    - strategic_intent_ref
    - audience_context_ref
    - objective
    - requested_outcome
    - inputs
    - knowledge_basis
    - dependencies
    - required_capabilities
    - owner
    - priority
    - constraints
    - acceptance_criteria
    - release_requirements
    - success_signals

capability_contract:
  required:
    - capability_id
    - input_contract
    - output_contract
    - preconditions
    - constraints
    - quality_requirements
    - authority_requirements
    - failure_semantics
    - observability_requirements

executor_contract:
  required:
    - capability_binding
    - execution_identity
    - provider_adapter
    - result_contract
    - recovery_semantics
    - idempotency_policy
    - authority_boundary

release:
  may_bundle: true
  readiness_boundary: explicit

quality:
  verification_revision_bound: true
  acceptance_distinct_from_verification: true
  acceptance_distinct_from_publication: true
  publication_distinct_from_outcome: true
  execution_result_not_automatically_accepted: true

authority:
  execution_does_not_imply_authority: true
  publish_requires_explicit_authority: true
  external_effect_requires_explicit_boundary: true

learning:
  metric_is_not_learning: true
  learning_requires_interpretation: true
  knowledge_update_requires_explicit_promotion: true
  knowledge_validity_distinct_from_applicability: true
  applicability_distinct_from_retrieval: true
  retrieval_distinct_from_use: true
  use_distinct_from_decision_impact: true
  decision_impact_distinct_from_execution_impact: true
  execution_impact_distinct_from_external_outcome: true
  outcome_is_evidence_about_knowledge_not_automatic_proof_of_causality: true
  contradiction_requires_evaluation_before_revision: true
  knowledge_can_be_stale_or_superseded: true
  deliberate_challenge_and_unlearning_are_supported_requirements: true
  memory_admission_is_security_boundary: true
  automatic_promotion_not_authorized: true
  automatic_memory_authority_not_authorized: true
  self_modifying_learning_policy_not_authorized: true
  research_basis: 10_records/2026-09-13-learning-loop-program-1-research-synthesis.md
  decision_basis: 05_decision/2026-09-13-program-1-learning-loop-model-evolution.md
  audit_basis: 10_records/2026-09-13-repository-external-evidence-audit.md
  next_empirical_boundary: memory_informed_decision -> changed_execution -> real_external_outcome -> evaluation -> memory_revision
