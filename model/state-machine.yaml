version: 1
status: working_model
purpose: conceptual editorial state machine for case-based validation

state_families:
  intake:
    - SIGNAL
    - QUESTION
    - CANDIDATE
  research:
    - RESEARCH_REQUIREMENT
    - RESEARCH_ACTIVE
    - KNOWLEDGE_DRAFT
    - KNOWLEDGE_SUFFICIENT
    - KNOWLEDGE_INCONCLUSIVE
    - KNOWLEDGE_AFFECTED
  editorial:
    - EDITORIAL_PENDING
    - EDITORIAL_PROCEED
    - EDITORIAL_HOLD
    - EDITORIAL_REJECT
    - EDITORIAL_UPDATE
  production:
    - SPEC_DRAFT
    - SPEC_READY
    - ASSET_DRAFT
    - ASSET_READY_FOR_VERIFICATION
    - ASSET_REVISION_REQUIRED
  verification_effect:
    - VERIFICATION_PENDING
    - VERIFIED
    - VERIFICATION_FAILED
    - ACCEPTED
    - REJECTED
    - RELEASE_CANDIDATE
    - PUBLISHED
    - PUBLICATION_HELD
    - RETIRED
  learning:
    - OBSERVED
    - INTERPRETED
    - LEARNING_CANDIDATE
    - LEARNING_ACCEPTED
    - NEW_EVIDENCE
    - KNOWLEDGE_UPDATE_REQUIRED

transitions:
  - id: T01
    from: SIGNAL
    to: QUESTION
    operation: frame_question
    authority: Discovery
  - id: T02
    from: QUESTION
    to: CANDIDATE
    operation: formulate_candidate
    authority: Discovery
  - id: T03
    from: CANDIDATE
    to: RESEARCH_REQUIREMENT
    operation: admit
    authority: CandidateAuthority
  - id: T04
    from: RESEARCH_REQUIREMENT
    to: RESEARCH_ACTIVE
    operation: begin_research
    authority: Research
  - id: T05
    from: RESEARCH_ACTIVE
    to: KNOWLEDGE_DRAFT
    operation: add_findings
    authority: Research
  - id: T06
    from: KNOWLEDGE_DRAFT
    to: KNOWLEDGE_SUFFICIENT
    operation: assess_sufficiency
    authority: Research
  - id: T07
    from: KNOWLEDGE_DRAFT
    to: RESEARCH_ACTIVE
    operation: continue_research
    authority: Research
  - id: T08
    from: KNOWLEDGE_DRAFT
    to: KNOWLEDGE_INCONCLUSIVE
    operation: declare_inconclusive
    authority: Research
  - id: T09
    from: KNOWLEDGE_SUFFICIENT
    to: EDITORIAL_PENDING
    operation: submit_for_editorial_decision
    authority: Editorial
  - id: T10
    from: EDITORIAL_PENDING
    to: EDITORIAL_PROCEED
    operation: proceed
    authority: Editorial
  - id: T11
    from: EDITORIAL_PENDING
    to: EDITORIAL_HOLD
    operation: hold
    authority: Editorial
  - id: T12
    from: EDITORIAL_PENDING
    to: EDITORIAL_REJECT
    operation: reject
    authority: Editorial
  - id: T13
    from: EDITORIAL_PENDING
    to: EDITORIAL_UPDATE
    operation: update_existing
    authority: Editorial
  - id: T14
    from: EDITORIAL_PROCEED
    to: SPEC_DRAFT
    operation: create_spec
    authority: ContentDesign
  - id: T15
    from: SPEC_DRAFT
    to: SPEC_READY
    operation: satisfy_spec_contract
    authority: ContentDesign
  - id: T16
    from: SPEC_READY
    to: ASSET_DRAFT
    operation: produce
    authority: Production
  - id: T17
    from: ASSET_DRAFT
    to: ASSET_READY_FOR_VERIFICATION
    operation: submit_for_verification
    authority: Production
  - id: T18
    from: ASSET_READY_FOR_VERIFICATION
    to: VERIFICATION_PENDING
    operation: open_verification
    authority: Verification
  - id: T19
    from: VERIFICATION_PENDING
    to: VERIFIED
    operation: pass
    authority: Verification
  - id: T20
    from: VERIFICATION_PENDING
    to: VERIFICATION_FAILED
    operation: fail
    authority: Verification
  - id: T21
    from: VERIFICATION_FAILED
    to: ASSET_REVISION_REQUIRED
    operation: request_revision
    authority: Verification
  - id: T22
    from: ASSET_REVISION_REQUIRED
    to: ASSET_DRAFT
    operation: revise
    authority: Production
  - id: T23
    from: VERIFIED
    to: ACCEPTED
    operation: accept_exact_revision
    authority: AcceptanceAuthority
  - id: T24
    from: VERIFIED
    to: REJECTED
    operation: reject_exact_revision
    authority: AcceptanceAuthority
  - id: T25
    from: ACCEPTED
    to: RELEASE_CANDIDATE
    operation: assemble_release
    authority: Publication
  - id: T26
    from: RELEASE_CANDIDATE
    to: PUBLISHED
    operation: publish
    authority: Publication
  - id: T27
    from: PUBLISHED
    to: RETIRED
    operation: retire
    authority: Publication
  - id: T28
    from: PUBLISHED
    to: OBSERVED
    operation: record_observation
    authority: Observation
  - id: T29
    from: OBSERVED
    to: INTERPRETED
    operation: interpret
    authority: Learning
  - id: T30
    from: INTERPRETED
    to: LEARNING_CANDIDATE
    operation: propose_learning
    authority: Learning
  - id: T31
    from: LEARNING_CANDIDATE
    to: LEARNING_ACCEPTED
    operation: accept_learning
    authority: EditorialLearning
  - id: T32
    from: OBSERVED
    to: NEW_EVIDENCE
    operation: register_new_evidence
    authority: Research
  - id: T33
    from: NEW_EVIDENCE
    to: KNOWLEDGE_UPDATE_REQUIRED
    operation: assess_impact
    authority: Research
  - id: T34
    from: KNOWLEDGE_UPDATE_REQUIRED
    to: KNOWLEDGE_AFFECTED
    operation: mark_knowledge_affected
    authority: Research
  - id: T35
    from: KNOWLEDGE_AFFECTED
    to: EDITORIAL_PENDING
    operation: reopen_affected_decision
    authority: Editorial

invariants:
  - revision_bound_review
  - no_silent_factual_expansion
  - explicit_unknowns
  - append_only_history
  - external_effect_is_explicit
  - learning_is_not_knowledge_truth
  - no_implicit_authority_inheritance

relations:
  - produced_from
  - depends_on
  - verified_against
  - accepted_against
  - published_as
  - supersedes
  - invalidates
  - impacts
