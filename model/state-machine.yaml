version: 2
status: working_model
purpose: object-specific editorial state machines linked by explicit relations

principle: one_object_one_lifecycle

objects:
  candidate:
    states: [SIGNAL, QUESTION, CANDIDATE, ADMITTED, HELD, REJECTED]
    transitions:
      - {from: SIGNAL, to: QUESTION, operation: frame_question, authority: Discovery}
      - {from: QUESTION, to: CANDIDATE, operation: formulate_candidate, authority: Discovery}
      - {from: CANDIDATE, to: ADMITTED, operation: admit, authority: CandidateAuthority}
      - {from: CANDIDATE, to: HELD, operation: hold, authority: CandidateAuthority}
      - {from: CANDIDATE, to: REJECTED, operation: reject, authority: CandidateAuthority}

  research:
    states: [RESEARCH_REQUIREMENT, RESEARCH_ACTIVE, SUFFICIENT, INCONCLUSIVE, AFFECTED, CLOSED]
    transitions:
      - {from: RESEARCH_REQUIREMENT, to: RESEARCH_ACTIVE, operation: begin, authority: Research}
      - {from: RESEARCH_ACTIVE, to: SUFFICIENT, operation: assess_sufficiency, authority: Research}
      - {from: RESEARCH_ACTIVE, to: INCONCLUSIVE, operation: declare_inconclusive, authority: Research}
      - {from: RESEARCH_ACTIVE, to: RESEARCH_ACTIVE, operation: continue, authority: Research}
      - {from: SUFFICIENT, to: AFFECTED, operation: upstream_change, authority: Research}
      - {from: AFFECTED, to: RESEARCH_ACTIVE, operation: reopen, authority: Research}
      - {from: SUFFICIENT, to: CLOSED, operation: close, authority: Research}

  knowledge_revision:
    states: [DRAFT, SUFFICIENT, AFFECTED, SUPERSEDED]
    transitions:
      - {from: DRAFT, to: SUFFICIENT, operation: establish_sufficiency, authority: Research}
      - {from: SUFFICIENT, to: AFFECTED, operation: dependency_change, authority: Research}
      - {from: AFFECTED, to: SUFFICIENT, operation: revalidate, authority: Research}
      - {from: SUFFICIENT, to: SUPERSEDED, operation: create_new_revision, authority: Research}

  editorial_decision:
    states: [PENDING, PROCEED, HOLD, REJECT, UPDATE_EXISTING, SUPERSEDED]
    transitions:
      - {from: PENDING, to: PROCEED, operation: proceed, authority: Editorial}
      - {from: PENDING, to: HOLD, operation: hold, authority: Editorial}
      - {from: PENDING, to: REJECT, operation: reject, authority: Editorial}
      - {from: PENDING, to: UPDATE_EXISTING, operation: update_existing, authority: Editorial}
      - {from: PROCEED, to: SUPERSEDED, operation: replace_decision, authority: Editorial}

  content_spec_revision:
    states: [DRAFT, READY, AFFECTED, SUPERSEDED]
    transitions:
      - {from: DRAFT, to: READY, operation: satisfy_contract, authority: ContentDesign}
      - {from: READY, to: AFFECTED, operation: upstream_change, authority: ContentDesign}
      - {from: AFFECTED, to: DRAFT, operation: revise, authority: ContentDesign}
      - {from: READY, to: SUPERSEDED, operation: create_new_revision, authority: ContentDesign}

  asset_revision:
    states: [DRAFT, READY_FOR_VERIFICATION, REVISION_REQUIRED, ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - {from: DRAFT, to: READY_FOR_VERIFICATION, operation: submit, authority: Production}
      - {from: READY_FOR_VERIFICATION, to: REVISION_REQUIRED, operation: fail_verification, authority: Verification}
      - {from: REVISION_REQUIRED, to: DRAFT, operation: revise, authority: Production}
      - {from: READY_FOR_VERIFICATION, to: ACCEPTED, operation: accept_exact_revision, authority: AcceptanceAuthority}
      - {from: READY_FOR_VERIFICATION, to: REJECTED, operation: reject_exact_revision, authority: AcceptanceAuthority}
      - {from: ACCEPTED, to: SUPERSEDED, operation: create_new_revision, authority: Production}

  verification_result:
    states: [PENDING, PASSED, FAILED, SUPERSEDED]
    transitions:
      - {from: PENDING, to: PASSED, operation: pass, authority: Verification}
      - {from: PENDING, to: FAILED, operation: fail, authority: Verification}
      - {from: PASSED, to: SUPERSEDED, operation: newer_revision_verified, authority: Verification}
      - {from: FAILED, to: SUPERSEDED, operation: newer_revision_verified, authority: Verification}

  release:
    states: [DRAFT, READY, HELD, PUBLISHED, RETIRED, SUPERSEDED]
    transitions:
      - {from: DRAFT, to: READY, operation: assemble_from_accepted_revisions, authority: Publication}
      - {from: READY, to: HELD, operation: hold, authority: Publication}
      - {from: READY, to: PUBLISHED, operation: publish, authority: Publication}
      - {from: HELD, to: PUBLISHED, operation: publish, authority: Publication}
      - {from: PUBLISHED, to: RETIRED, operation: retire, authority: Publication}
      - {from: PUBLISHED, to: SUPERSEDED, operation: replace_with_new_release, authority: Publication}

  observation:
    states: [RECORDED, INTERPRETED, CLOSED]
    transitions:
      - {from: RECORDED, to: INTERPRETED, operation: interpret, authority: Learning}
      - {from: INTERPRETED, to: CLOSED, operation: close, authority: Learning}

  learning:
    states: [CANDIDATE, ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - {from: CANDIDATE, to: ACCEPTED, operation: accept_for_reuse, authority: EditorialLearning}
      - {from: CANDIDATE, to: REJECTED, operation: reject, authority: EditorialLearning}
      - {from: ACCEPTED, to: SUPERSEDED, operation: replace_learning, authority: EditorialLearning}

  evidence:
    states: [OBSERVED, RELEVANT, AFFECTED, INVALID, SUPERSEDED]
    transitions:
      - {from: OBSERVED, to: RELEVANT, operation: assess_relevance, authority: Research}
      - {from: RELEVANT, to: AFFECTED, operation: source_change, authority: Research}
      - {from: AFFECTED, to: INVALID, operation: invalidate, authority: Research}
      - {from: RELEVANT, to: SUPERSEDED, operation: replace_evidence, authority: Research}

relations:
  - produced_from
  - supports
  - contradicts
  - depends_on
  - verified_against
  - accepted_against
  - assembled_into
  - published_as
  - supersedes
  - invalidates
  - impacts

invariants:
  - one_object_one_lifecycle
  - revision_bound_review
  - no_silent_factual_expansion
  - explicit_unknowns
  - append_only_history
  - external_effect_is_explicit
  - learning_is_not_knowledge_truth
  - no_implicit_authority_inheritance
  - observation_is_not_publication_state
